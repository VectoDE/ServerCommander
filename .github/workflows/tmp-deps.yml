name: tmp deps update

on:
  push:
    branches:
      - fix/go-ci-and-deps

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Update modules
        run: |
          go version
          go mod edit -go=1.27.0 -toolchain=go1.27.4
          go get golang.org/x/crypto@latest golang.org/x/term@latest golang.org/x/sys@latest github.com/zalando/go-keyring@latest
          go get -u ./...
          go mod tidy
          gofmt -s -w src
          cat go.mod
          git diff --stat
      - name: Checks (informativ)
        continue-on-error: true
        run: |
          go vet ./... 2>&1 | tee vet.txt || true
          go test ./... 2>&1 | tee test.txt || true
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./... 2>&1 | tee vuln.txt || true
          go run honnef.co/go/tools/cmd/staticcheck@latest ./... 2>&1 | tee staticcheck.txt || true
          GOOS=windows go build ./... 2>&1 | tee build-windows.txt || true
          gofmt -s -l . | tee gofmt.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps
          path: |
            go.mod
            go.sum
            src/**/*.go
            *.txt
